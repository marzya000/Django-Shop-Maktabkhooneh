{% extends 'accounts/base_account.html' %}


{% block content %}

<main id="content" role="main">
  <div class="container content-space-3 content-space-t-lg-4 content-space-b-lg-3">
    <div class="flex-grow-1 mx-auto text-center" style="max-width: 32rem;">

      <div class="mb-5">
        <i class="bi bi-envelope-check display-3 text-primary"></i>
      </div>

      <h1 class="h2 mb-3">
        ایمیل ارسال شد
      </h1>

      <p class="mb-5">
        اگر حسابی با این آدرس ایمیل وجود داشته باشد،
        لینک بازنشانی رمز عبور برای شما ارسال شده است.
      </p>

      <a href="{% url 'accounts:login' %}" class="btn btn-primary">
        بازگشت به صفحه ورود
      </a>

    </div>
  </div>
</main>

{% endblock content %}
